name: Gizli karakter kontrolü

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  kontrol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Tüm dosyalarda görünmez karakter ara
        run: git ls-files -z | xargs -0 node app.js --kontrol
